services:

  response:
    build:
      context: .
      dockerfile: Dockerfile.response
    image: response
    entrypoint: bash
    command: /app/startup.sh --watch
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: curl -f http://localhost:8000/ht/ || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./opgincidentresponse:/app/opgincidentresponse
      - ./response:/app/response
      - ./startup.sh:/app/startup.sh
      - ./manage.py:/app/manage.py
      - pypd:/app/pypd
      - static-content:/app/opgincidentresponse/static
    stdin_open: true
    tty: true
    restart: always

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: response-nginx
    depends_on:
      response:
        condition: service_healthy
    environment:
      APP_HOST: response
      APP_PORT: 8000
    healthcheck:
      test: curl -f http://localhost/nginx-health || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - static-content:/app/opgincidentresponse/static
    ports:
      - 80:80

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    image: cron
    container_name: cron
    depends_on:
      - response
    tty: true

  db:
    image: "postgres:14@sha256:a26d06e6878f114ab53aace021fd9c599b498cca4c5ba2c18b34aee472f20148"
    container_name: postgres
    healthcheck:
      test: pg_isready --username=api --dbname=api
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_14_vol:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      PGPASSWORD: postgres

  ngrok:
    image: ngrok/ngrok:latest@sha256:ff3b5c3674432d14a786349908b7bdf28ee56c25662637afcbe7180d471993ef
    restart: unless-stopped
    command:
      - "http"
      - "http://response:8000"
    container_name: ngrok
    env_file: .env
    ports:
      - "4040:4040"
    depends_on:
      response:
        condition: service_healthy

  assets:
    image: node:lts-alpine3.23@sha256:e6c03d42b46af3b1e98207e59f06a43cfe5efd3ec4b4d3d9802bddf04f833374
    volumes:
      - ./nginx/assets:/app
    working_dir: /app
    command: sh -c "npm ci --ignore-scripts && npm run build"



  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    volumes:
      - ./response:/app/response
      - ./tests:/app/tests
      - ./testcfg:/app/testcfg

volumes:
  postgres_data_14_vol:
  pypd:
  static-content:
