{% extends "govuk_base.html" %}
{% load unslackify %}

{% block title %}
    OPG Incident Response
{% endblock %}

{% block content %}
    <h1 class="govuk-heading-xl">Sign in</h1>

    <p class="govuk-body">You must sign in with GitHub to continue.</p>

    <form method="post" action="{% url 'social:begin' 'github-org' %}">
      {% csrf_token %}

      <input type="hidden" name="next" value="{{ request.GET.next }}">

      <button type="submit" draggable="false" class="govuk-button govuk-button--start" data-module="govuk-button">
        Sign in with GitHub
        <svg class="govuk-button__start-icon" xmlns="http://www.w3.org/2000/svg" width="17.5" height="19" viewBox="0 0 33 40" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M0 0h13l20 20-20 20H0l20-20z" />
        </svg>
      </button>
  </form>
{% endblock %}
